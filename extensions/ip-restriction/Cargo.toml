[package]
name = "ip-restriction"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tetratelabs/built-on-envoy"

[dependencies]
# The SDK version must match the Envoy version due to the strict compatibility requirements.
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "b2d89e0ae53916f28770771fbdd49c5c99c5c5a2" }
ipnet = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The mock feature provides MockEnvoyHttpFilter for the tests.
envoy-proxy-dynamic-modules-rust-sdk = { git = "https://github.com/envoyproxy/envoy", rev = "b2d89e0ae53916f28770771fbdd49c5c99c5c5a2", features = ["mock"] }
jsonschema = "0.28"

[lib]
name = "ip_restriction"
path = "src/lib.rs"
crate-type = ["cdylib"]
